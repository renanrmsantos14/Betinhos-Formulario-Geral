                        If(
                            !varErroGlobalOcorreu && IsBlank(CampoTipoDoVeículo_1.Selected.Value) && Not(Text(CampoStatus_1.Selected.Value) = "Troca de Veículos"),
                            Notify(
                                "'Tipo do Veículo' é obrigatório.",
