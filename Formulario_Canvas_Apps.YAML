                      Width: =140
                - ButtonCanvas1_15:
                    Control: Button@0.0.45
                    Properties:
                      Align: =Align.Center
                      BasePaletteColor: =If(varCurrentTab = "BD", Color.LightGray, RGBA(26, 122, 232, 1))
                      BorderRadius: =7
                      FontWeight: =FontWeight.Normal
                      Height: =45
                      Icon: ="Save"
                      IconStyle: ='ButtonCanvas.IconStyle'.Filled
                      Layout: ='ButtonCanvas.Layout'.IconBefore
                      LayoutMinHeight: =16
                      LayoutMinWidth: =16
                      OnSelect: |
                        =// ================================================================================
                        // PASSO 1: INICIALIZAR COLEÇÃO DE ORDEM DE PASSAGEIROS
                        // ✅ FIX 7: ClearCollect duplicado removido — apenas uma execução
                        // ================================================================================
                        // DEPOIS
                        Set(
                            varEnderecoCompleto,
                            If(
                                varEdSaidaPersonalizado,
                                CampoEdSaidaPersonalizado.Text,
                                Concat(
                                    SortByColumns(
                                        Filter(
                                            colPassageirosServico,
                                            Not(IsBlank(Passageiro))
                                        ),
                                        "OrdemSelecao",
                                        SortOrder.Ascending
                                    ) As _item,
                                    With(
                                        {ordemAtual: _item.OrdemSelecao},
                                        ordemAtual & ". " &
                                        // DEPOIS
                         Coalesce(
                                            First(
                                                Split(
                                                    _item.Passageiro.'Nome do Passageiro',
                                                    " "
                                                )
                                            ).Value,
                                            "Passageiro " & ordemAtual
                                        ) & " - " & Coalesce(
                                            LookUp(
                                                colEnderecoRascunho,
                                                OrdemSelecao = ordemAtual,
                                                EnderecoDigitado
                                            ),
                                            _item.EnderecoEditado,
                                            "indeterminado"
                                        )
                                    ),
                                    "; " & Char(10)
                                )
                            )
                        );
                        // DEPOIS
                        ClearCollect(
                            colOrdemPassageiros,
                            ForAll(
                                SortByColumns(
                                    Filter(
                                        colPassageirosServico,
                                        Not(IsBlank(Passageiro))
                                    ),
                                    "OrdemSelecao",
                                    SortOrder.Ascending
                                ) As _item,
                                {
                                    Passageiro: _item.Passageiro,
                                    OrdemSelecao: _item.OrdemSelecao,
                                    GUIDPassageiro: _item.GUIDPassageiro,
                                    EnderecoSaidaBD: Coalesce(
                                        LookUp(
                                            colEnderecoRascunho,
                                            OrdemSelecao = _item.OrdemSelecao,
                                            EnderecoDigitado
                                        ),
                                        _item.EnderecoEditado,
                                        ""
                                    )
                                }
                            )
                        );
                        // ================================================================================
                        // INICIALIZAÇÃO E OBSERVAÇÕES
                        // ================================================================================
                        Switch(
                            TipoObsAtual,
                            "Motorista",
                            Set(
                                ObsMotorista,
                                CampoObsOp_1.Text
                            ),
                            "Interna",
                            Set(
                                ObsInterna,
                                CampoObsOp_1.Text
                            ),
                            "Passageiro",
                            Set(
                                ObsPassageiro,
                                CampoObsOp_1.Text
                            ),
                            "Final",
                            Set(
                                ObsFinal,
                                CampoObsOp_1.Text
                            )
                        );
                        Set(
                            varTotalAgendamentos,
                            0
                        );
                        Set(
                            varPatchSucesso,
                            false
                        );
                        Set(
                            varErroGlobalOcorreu,
                            false
                        );
                        ClearCollect(
                            colErrosTemporarios,
                            []
                        );
                        ClearCollect(
                            colPatchResults,
                            []
                        );
                        // ================================================================================
                        // PREPARAÇÃO DOS DADOS
                        // ================================================================================
                        Set(
                            varDataHoraRetorno,
                            CampoDataRet_3.SelectedDate + Time(
                                Value(CampoHoraRet_3.Selected.Value),
                                Value(CampoMinutoRet_3.Selected.Value),
                                0
                            )
                        );
                        Set(
                            varRetPrevTime,
                            Time(
                                Value(CampoHorarioRetPrev_2.Selected.Value),
                                Value(CampoMinutoRetPrev_2.Selected.Value),
                                0
                            )
                        );
                        Set(
                            varSaidaTime,
                            Time(
                                Value(CampoHoraSaida_2.Selected.Value),
                                Value(CampoMinutoSaida_2.Selected.Value),
                                0
                            )
                        );
                        Set(
                            varDatadeRetornoPrevBase,
                            If(
                                !IsBlank(CampoHorarioRetPrev_2.Selected.Value) && !IsBlank(CampoMinutoRetPrev_2.Selected.Value),
                                If(
                                    varRetPrevTime < varSaidaTime,
                                    DateAdd(
                                        CampoDataSaida_2.SelectedDate,
                                        1,
                                        TimeUnit.Days
                                    ),
                                    CampoDataSaida_2.SelectedDate
                                ),
                                CampoDataSaida_2.SelectedDate
                            )
                        );
                        Set(
                            varDataHoraRetornoPrevista,
                            If(
                                IsBlank(CampoHorarioRetPrev_2.Selected.Value) || IsBlank(CampoMinutoRetPrev_2.Selected.Value),
                                Blank(),
                                If(
                                    Value(CampoHorarioRetPrev_2.Selected.Value) = 0 && Value(CampoMinutoRetPrev_2.Selected.Value) = 0,
                                    DateTime(
                                        Year(CampoDataSaida_2.SelectedDate),
                                        Month(CampoDataSaida_2.SelectedDate),
                                        Day(CampoDataSaida_2.SelectedDate),
                                        0,
                                        0,
                                        0
                                    ),
                                    DateTime(
                                        Year(varDatadeRetornoPrevBase),
                                        Month(varDatadeRetornoPrevBase),
                                        Day(varDatadeRetornoPrevBase),
                                        Value(CampoHorarioRetPrev_2.Selected.Value),
                                        Value(CampoMinutoRetPrev_2.Selected.Value),
                                        0
                                    )
                                )
                            )
                        );
                        Set(
                            varTrajeto,
                            CampoTrajeto_2.Text
                        );
                        Set(
                            varDataHoraPrincipal,
                            DateTime(
                                Year(CampoDataSaida_2.SelectedDate),
                                Month(CampoDataSaida_2.SelectedDate),
                                Day(CampoDataSaida_2.SelectedDate),
                                Value(CampoHoraSaida_2.Selected.Value),
                                Value(CampoMinutoSaida_2.Selected.Value),
                                0
                            )
                        );
                        // ================================================================================
                        // PASSAGEIROS
                        // ================================================================================
                        Set(
                            varEmaildoPassageiro,
                            Coalesce(
                                LookUp(
                                    colPassageirosServico,
                                    OrdemSelecao = 1 && !IsBlank(Passageiro),
                                    Passageiro.Email
                                ),
                                LookUp(
                                    colPassageirosServico,
                                    OrdemSelecao = 2 && !IsBlank(Passageiro),
                                    Passageiro.Email
                                ),
                                LookUp(
                                    colPassageirosServico,
                                    OrdemSelecao = 3 && !IsBlank(Passageiro),
                                    Passageiro.Email
                                ),
                                LookUp(
                                    colPassageirosServico,
                                    OrdemSelecao = 4 && !IsBlank(Passageiro),
                                    Passageiro.Email
                                ),
                                ""
                            )
                        );
                        Set(
                            varPreferenciasConcatenadas,
                            Concat(
                                Filter(
                                    SortByColumns(
                                        colPassageirosServico,
                                        "OrdemSelecao",
                                        SortOrder.Ascending
                                    ),
                                    !IsBlank(Passageiro) && !IsBlank(Passageiro.'Preferências do Passageiro') && Trim(Passageiro.'Preferências do Passageiro') <> ""
                                ) As _item,
                                Coalesce(
                                    First(
                                        Split(
                                            _item.Passageiro.'Nome do Passageiro',
                                            " "
                                        )
                                    ).Value,
                                    _item.Passageiro.'Nome do Passageiro'
                                ) & " - " & Trim(_item.Passageiro.'Preferências do Passageiro'),
                                ";" & Char(10)
                            )
                        );
                        Set(
                            varPassageirosTelefones,
                            Concat(
                                SortByColumns(
                                    Filter(
                                        colPassageirosServico,
                                        !IsBlank(Passageiro)
                                    ),
                                    "OrdemSelecao",
                                    SortOrder.Ascending
                                ) As _item,
                                _item.Passageiro.'Nome do Passageiro' & " - " & Coalesce(
                                    _item.Telefone,
                                    "indeterminado"
                                ),
                                ";" & Char(10)
                            )
                        );
                        // ================================================================================
                        // VALIDAÇÃO DOS CAMPOS OBRIGATÓRIOS
                        // ================================================================================
                        If(
                            !varErroGlobalOcorreu && (IsBlank(CampoDataSaida_2.SelectedDate) || CampoHoraSaida_2.Selected.Value = "" || CampoMinutoSaida_2.Selected.Value = ""),
                            Notify(
                                "'Data e horário de saída' são obrigatórios.",
                                NotificationType.Error,
                                7000
                            );
                            Set(
                                varErroGlobalOcorreu,
                                true
                            )
                        );
                        If(
                            !varErroGlobalOcorreu && IsBlank(CampoTipodeServiço_1.Selected.Value) && Not(Text(CampoStatus_1.Selected.Value) = "Troca de Veículos"),
                            Notify(
                                "'Tipo do Serviço' é obrigatório.",
                                NotificationType.Error,
                                7000
                            );
                            Set(
                                varErroGlobalOcorreu,
                                true
