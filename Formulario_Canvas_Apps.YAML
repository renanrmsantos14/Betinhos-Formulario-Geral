                                NotificationType.Error,
                                7000
                            );
                            Set(
                                varErroGlobalOcorreu,
                                true
                            )
                        );
                        If(
                            !varErroGlobalOcorreu && IsBlank(CampoEndSaidaRet_3.Text) && CampoAgendarRet_2.Value = true,
                            Notify(
                                "'Endereço de Saída - Retorno' é obrigatório.",
                                NotificationType.Error,
                                7000
                            );
                            Set(
                                varErroGlobalOcorreu,
                                true
                            )
                        );
                        If(
                            !varErroGlobalOcorreu && IsBlank(CampoDestinoRet_4.Text) && CampoAgendarRet_2.Value,
                            Notify(
                                "'Destino - Retorno' é obrigatório.",
                                NotificationType.Error,
                                7000
                            );
                            Set(
                                varErroGlobalOcorreu,
                                true
                            )
                        );
                        If(
                            !varErroGlobalOcorreu && CampoRepetir_1.Value && (IsBlank(CampoDataInicio_2.SelectedDate) || IsBlank(CampoDataFim_1.SelectedDate)),
                            Notify(
                                "'Data de Início e Fim - Serviços Frequentes' são obrigatórios.",
                                NotificationType.Error,
                                7000
                            );
                            Set(
                                varErroGlobalOcorreu,
                                true
                            )
                        );
                        If(
                            !varErroGlobalOcorreu && CampoRepetir_1.Value && IsBlank(CampoRadioFrequente_1.Selected.Value),
                            Notify(
                                "'Tipo de Serviço Frequente' é obrigatório.",
                                NotificationType.Error,
                                7000
                            );
                            Set(
                                varErroGlobalOcorreu,
                                true
                            )
                        );
                        // ================================================================================
                        // VALIDAÇÃO: PASSAGEIROS DUPLICADOS
                        // ================================================================================
                        With(
                            {
                                _pax: Filter(
                                    colPassageirosServico,
                                    !IsBlank(Passageiro)
                                )
                            },
                            If(
                                !varErroGlobalOcorreu && CountRows(_pax) > 0 && CountRows(_pax) <> CountRows(
                                    Distinct(
                                        _pax,
                                        GUIDPassageiro
                                    )
                                ),
                                Notify(
                                    "Erro: passageiro duplicado na lista. Remova as duplicatas.",
                                    NotificationType.Error,
                                    7000
                                );
                                Set(
                                    varErroGlobalOcorreu,
                                    true
                                )
                            )
                        );
                        // ================================================================================
                        // EXECUÇÃO PRINCIPAL
                        // ================================================================================
                        If(
                            !varErroGlobalOcorreu,
                            UpdateContext({varpopupLoading: true});
                            // ============================================================================
                            // NOVO REGISTRO
                            // ============================================================================
                            If(
                                gblIsNewRecord = true,
                                Set(
                                    resultadoPatchPrincipal,
                                    Patch(
                                        'Reserva de veículos',
                                        Defaults('Reserva de veículos'),
                                        {
                                            'Ed de Saída - VIEW': varEnderecoCompleto,
                                            'Endereço de Saída Personalizado': If(
                                                varEdSaidaPersonalizado,
                                                CampoEdSaidaPersonalizado.Text,
                                                Blank()
                                            ),
                                            'Status de Faturamento': CampoStatusdeFaturamento.Selected.Value,
                                            Destino: CampoDestino.Text,
                                            'Data e horário de saída': varDataHoraPrincipal,
                                            'Previsão de retorno': varDataHoraRetornoPrevista,
                                            'Tipo do Serviço': CampoTipodeServiço_1.Selected.Value,
                                            'Obs de Operação': ObsMotorista,
                                            'Observação interna': ObsInterna,
                                            'Observação Final': ObsFinal,
                                            'Perfil do passageiro': varPreferenciasConcatenadas,
                                            'Tipo de Veículo': CampoTipoDoVeículo_1.Selected.Value,
                                            Email: varEmaildoPassageiro,
                                            Trajeto: varTrajeto,
                                            'Pax - VIEW': varPassageirosTelefones,
                                            Solicitante: If(
                                                !IsBlank(CampoSolicitante_2.Selected),
                                                CampoSolicitante_2.Selected,
                                                Blank()
                                            ),
                                            Cliente: If(
                                                !IsBlank(CampoCliente_2.Selected),
                                                CampoCliente_2.Selected,
                                                Blank()
                                            ),
                                            Cotação: Value(CampoCotacao_2.Text),
                                            Receber: CampoReceber_2.Value,
                                            CR: CampoCR_2.Text,
                                            'Forma de Pagamento': CampoFormaPagamento_2.Selected.Value,
                                            Motorista: CampoMotorista_1.Selected,
                                            OP: CampoOP.Selected,
                                            'Status de Operação': CampoStatus_1.Selected.Value,
                                            Proprietário: User()
                                        }
                                    )
                                );
                                If(
                                    !IsError(resultadoPatchPrincipal) && !IsBlank(resultadoPatchPrincipal),
                                    Collect(
                                        colPatchResults,
                                        {
                                            Data: varDataHoraPrincipal,
                                            Tipo: "Principal",
                                            Resultado: resultadoPatchPrincipal
                                        }
                                    );
                                    // Relacionamento N:N Principal
                                    If(
                                        CountRows(colOrdemPassageiros) > 0,
                                        ForAll(
                                            colOrdemPassageiros,
                                            Patch(
                                                'Serviços por Passageiro',
                                                Defaults('Serviços por Passageiro'),
                                                {
                                                    'Geral (Coluna Serviços por Passageiro)': resultadoPatchPrincipal,
                                                    'Banco de Dados (Coluna Serviços por Passageiro)': ThisRecord.Passageiro,
                                                    'Ordem de Seleção (Coluna Serviços por Passageiro)': ThisRecord.OrdemSelecao,
                                                    'Endereço de Saída (Coluna Serviços por Passageiro)': If(
                                                        varEdSaidaPersonalizado,
                                                        "",
                                                        Coalesce(
                                                            LookUp(
                                                                colEnderecoRascunho,
                                                                OrdemSelecao = ThisRecord.OrdemSelecao,
                                                                EnderecoDigitado
                                                            ),
                                                            ThisRecord.EnderecoSaidaBD,
                                                            ""
                                                        )
                                                    )
                                                }
                                            )
                                        )
                                    );
                                    Set(
                                        varDuracao,
                                        DateDiff(
                                            varDataHoraPrincipal,
                                            varDataHoraRetornoPrevista,
                                            TimeUnit.Days
                                        )
                                    );
                                    Set(
                                        varHoraSaida,
                                        Time(
                                            Hour(varDataHoraPrincipal),
                                            Minute(varDataHoraPrincipal),
                                            Second(varDataHoraPrincipal)
                                        )
                                    );
                                    // ====================================================================
                                    // SERVIÇOS FREQUENTES
                                    // ====================================================================
                                    If(
                                        CampoRepetir_1.Value && !IsBlank(CampoDataInicio_2.SelectedDate) && !IsBlank(CampoDataFim_1.SelectedDate),
                                        If(
                                            CampoDataFim_1.SelectedDate < CampoDataInicio_2.SelectedDate,
                                            Notify(
                                                "Data final não pode ser anterior à data inicial para serviços frequentes.",
                                                NotificationType.Error,
                                                7000
                                            );
                                            Collect(
                                                colErrosTemporarios,
                                                {Erro: "Data final não pode ser anterior à inicial!"}
                                            );
                                            UpdateContext({varpopupLoading: false});
                                            Set(
                                                varErroGlobalOcorreu,
                                                true
                                            ),
                                            // else:
                                            Set(
                                                varTodasDatas,
                                                ForAll(
                                                    Sequence(
                                                        DateDiff(
                                                            CampoDataInicio_2.SelectedDate,
                                                            CampoDataFim_1.SelectedDate,
                                                            TimeUnit.Days
                                                        ) + 1
                                                    ),
                                                    DateAdd(
                                                        CampoDataInicio_2.SelectedDate,
                                                        Value - 1,
                                                        TimeUnit.Days
                                                    )
                                                )
                                            );
                                            Set(
                                                varDatasFiltradas,
                                                If(
                                                    CampoFDS_1.Value = true,
                                                    varTodasDatas,
                                                    Filter(
                                                        varTodasDatas,
                                                        Weekday(Value) <> 1 && Weekday(Value) <> 7
                                                    )
                                                )
                                            );
                                            ClearCollect(
                                                DatasGeradas,
                                                ForAll(
                                                    varDatasFiltradas,
                                                    DateTime(
                                                        Year(Value),
                                                        Month(Value),
                                                        Day(Value),
                                                        Hour(varHoraSaida),
                                                        Minute(varHoraSaida),
                                                        Second(varHoraSaida)
                                                    )
                                                )
                                            );
                                            // FREQUENTE - IDA
                                            If(
                                                CampoRadioFrequente_1.Selected.Value = "Ida" || CampoRadioFrequente_1.Selected.Value = "Ida e retorno",
                                                ClearCollect(
                                                    colResultadosIda,
                                                    ForAll(
                                                        Filter(
                                                            DatasGeradas,
                                                            Value <> varDataHoraPrincipal
                                                        ),
                                                        With(
                                                            {
                                                                DataAtual: Value,
                                                                ResultadoPatch: Patch(
                                                                    'Reserva de veículos',
                                                                    Defaults('Reserva de veículos'),
                                                                    {
                                                                        'Ed de Saída - VIEW': varEnderecoCompleto,
                                                                        'Endereço de Saída Personalizado': If(
                                                                            varEdSaidaPersonalizado,
                                                                            CampoEdSaidaPersonalizado.Text,
                                                                            Blank()
                                                                        ),
                                                                        Destino: CampoDestino.Text,
                                                                        'Status de Faturamento': CampoStatusdeFaturamento.Selected.Value,
                                                                        'Data e horário de saída': Value,
                                                                        'Previsão de retorno': If(
                                                                            IsBlank(CampoHorarioRetPrev_2.Selected.Value) || IsBlank(CampoMinutoRetPrev_2.Selected.Value),
                                                                            Blank(),
                                                                            If(
                                                                                Value(CampoHorarioRetPrev_2.Selected.Value) = 0 && Value(CampoMinutoRetPrev_2.Selected.Value) = 0,
                                                                                DateTime(
                                                                                    Year(Value),
                                                                                    Month(Value),
                                                                                    Day(Value),
                                                                                    0,
                                                                                    0,
                                                                                    0
                                                                                ),
                                                                                With(
                                                                                    {
                                                                                        dataBaseRecorrente: If(
                                                                                            varRetPrevTime < varSaidaTime,
                                                                                            DateAdd(
                                                                                                Date(
                                                                                                    Year(Value),
                                                                                                    Month(Value),
                                                                                                    Day(Value)
                                                                                                ),
                                                                                                1,
                                                                                                TimeUnit.Days
                                                                                            ),
                                                                                            Date(
                                                                                                Year(Value),
                                                                                                Month(Value),
                                                                                                Day(Value)
                                                                                            )
                                                                                        )
                                                                                    },
                                                                                    DateTime(
                                                                                        Year(dataBaseRecorrente),
                                                                                        Month(dataBaseRecorrente),
                                                                                        Day(dataBaseRecorrente),
                                                                                        Value(CampoHorarioRetPrev_2.Selected.Value),
                                                                                        Value(CampoMinutoRetPrev_2.Selected.Value),
                                                                                        0
                                                                                    )
                                                                                )
                                                                            )
                                                                        ),
                                                                        'Tipo do Serviço': CampoTipodeServiço_1.Selected.Value,
                                                                        'Obs de Operação': ObsMotorista,
                                                                        'Observação interna': ObsInterna,
                                                                        'Observação Final': ObsFinal,
                                                                        'Perfil do passageiro': varPreferenciasConcatenadas,
                                                                        'Tipo de Veículo': CampoTipoDoVeículo_1.Selected.Value,
                                                                        Email: varEmaildoPassageiro,
                                                                        Trajeto: varTrajeto,
                                                                        'Pax - VIEW': varPassageirosTelefones,
                                                                        Solicitante: CampoSolicitante_2.Selected,
                                                                        Cliente: CampoCliente_2.Selected,
                                                                        Cotação: Value(CampoCotacao_2.Text),
                                                                        Receber: CampoReceber_2.Value,
                                                                        CR: CampoCR_2.Text,
                                                                        'Forma de Pagamento': CampoFormaPagamento_2.Selected.Value,
                                                                        Proprietário: User(),
                                                                        Motorista: CampoMotorista_1.Selected,
                                                                        OP: CampoOP.Selected,
                                                                        'Status de Operação': CampoStatus_1.Selected.Value
                                                                    }
                                                                )
                                                            },
                                                            {
                                                                DataAgendada: DataAtual,
                                                                Resultado: ResultadoPatch
                                                            }
                                                        )
                                                    )
                                                );
                                                // N:N Frequente Ida
                                                ForAll(
                                                    colResultadosIda,
                                                    With(
                                                        {ServicoAtual: ThisRecord.Resultado},
                                                        If(
                                                            !IsError(ServicoAtual) && !IsBlank(ServicoAtual) && CountRows(colOrdemPassageiros) > 0,
                                                            ForAll(
                                                                colOrdemPassageiros,
                                                                Patch(
                                                                    'Serviços por Passageiro',
                                                                    Defaults('Serviços por Passageiro'),
                                                                    {
                                                                        'Geral (Coluna Serviços por Passageiro)': ServicoAtual,
                                                                        'Banco de Dados (Coluna Serviços por Passageiro)': ThisRecord.Passageiro,
                                                                        'Ordem de Seleção (Coluna Serviços por Passageiro)': ThisRecord.OrdemSelecao,
                                                                        'Endereço de Saída (Coluna Serviços por Passageiro)': If(
                                                                            varEdSaidaPersonalizado,
                                                                            "",
                                                                            Coalesce(
                                                                                LookUp(
                                                                                    colEnderecoRascunho,
                                                                                    OrdemSelecao = ThisRecord.OrdemSelecao,
                                                                                    EnderecoDigitado
                                                                                ),
                                                                                ThisRecord.EnderecoSaidaBD,
                                                                                ""
                                                                            )
                                                                        )
                                                                    }
                                                                )
                                                            )
                                                        )
                                                    )
                                                );
                                                ForAll(
                                                    colResultadosIda,
                                                    Collect(
                                                        colPatchResults,
                                                        {
                                                            Data: ThisRecord.DataAgendada,
                                                            Tipo: "Ida",
                                                            Resultado: ThisRecord.Resultado
                                                        }
                                                    );
                                                    If(
                                                        IsError(ThisRecord.Resultado),
                                                        Notify(
                                                            "ERRO FREQUENTE (IDA): " & Text(
                                                                ThisRecord.DataAgendada,
                                                                "dd/mm/yyyy hh:mm"
                                                            ) & ". Detalhes: " & Concat(
                                                                Errors(
                                                                    'Reserva de veículos',
                                                                    ThisRecord.Resultado
                                                                ),
                                                                "Campo: " & ThisRecord.Column & " - Erro: " & ThisRecord.Message,
                                                                Char(10)
                                                            ),
                                                            NotificationType.Error,
                                                            7000
                                                        );
                                                        Collect(
                                                            colErrosTemporarios,
                                                            {
                                                                Erro: "Erro ao agendar serviço de ida para " & Text(
                                                                    ThisRecord.DataAgendada,
                                                                    "dd/mm/yyyy hh:mm"
                                                                ) & ": Erro no patch"
                                                            }
                                                        )
                                                    )
                                                )
                                            );
                                            // FREQUENTE - RETORNO
                                            If(
                                                CampoRadioFrequente_1.Selected.Value = "Retorno" || CampoRadioFrequente_1.Selected.Value = "Ida e retorno",
                                                Set(
                                                    varHorarioRetorno,
                                                    If(
                                                        !IsBlank(CampoHoraRet_3.Selected.Value) && !IsBlank(CampoMinutoRet_3.Selected.Value),
                                                        Time(
                                                            Value(CampoHoraRet_3.Selected.Value),
                                                            Value(CampoMinutoRet_3.Selected.Value),
                                                            0
                                                        ),
                                                        Time(
                                                            18,
                                                            0,
                                                            0
                                                        )
                                                    )
                                                );
                                                ClearCollect(
                                                    colResultadosRetorno,
                                                    ForAll(
                                                        Filter(
                                                            ForAll(
                                                                varDatasFiltradas,
                                                                DateTime(
                                                                    Year(Value),
                                                                    Month(Value),
                                                                    Day(Value),
                                                                    Hour(varHorarioRetorno),
                                                                    Minute(varHorarioRetorno),
                                                                    Second(varHorarioRetorno)
                                                                )
                                                            ),
                                                            Value <> varDataHoraRetorno
                                                        ),
                                                        With(
                                                            {
                                                                DataAtual: Value,
                                                                ResultadoPatch: Patch(
                                                                    'Reserva de veículos',
                                                                    Defaults('Reserva de veículos'),
                                                                    {
                                                                        'Ed de Saída - VIEW': CampoEndSaidaRet_3.Text,
                                                                        'Status de Faturamento': CampoStatusdeFaturamento.Selected.Value,
                                                                        Destino: CampoDestinoRet_4.Text,
                                                                        Trajeto: If(
                                                                            !IsBlank(varTrajeto) && CountRows(
                                                                                Split(
                                                                                    varTrajeto,
                                                                                    " / "
                                                                                )
                                                                            ) >= 2,
                                                                            With(
                                                                                {
                                                                                    partes: Split(
                                                                                        varTrajeto,
                                                                                        " / "
                                                                                    ),
                                                                                    n: CountRows(
                                                                                        Split(
                                                                                            varTrajeto,
                                                                                            " / "
                                                                                        )
                                                                                    )
                                                                                },
                                                                                Concat(
                                                                                    Sequence(n),
                                                                                    Last(
                                                                                        FirstN(
                                                                                            partes,
                                                                                            n - Value + 1
                                                                                        )
                                                                                    ).Value,
                                                                                    " / "
                                                                                )
                                                                            ),
                                                                            varTrajeto
                                                                        ),
                                                                        'Data e horário de saída': Value,
                                                                        'Pax - VIEW': varPassageirosTelefones,
                                                                        OP: CampoOP.Selected,
                                                                        'Obs de Operação': ObsMotoristaRet,
                                                                        'Observação interna': ObsInternaRet,
                                                                        'Observação Final': ObsFinalRet,
                                                                        'Perfil do passageiro': varPreferenciasConcatenadas,
                                                                        'Tipo de Veículo': CampoTipoDoVeículo_1.Selected.Value,
                                                                        'Tipo do Serviço': CampoTipodeServiço_1.Selected.Value,
                                                                        Email: varEmaildoPassageiro,
                                                                        Solicitante: CampoSolicitante_2.Selected,
                                                                        Cliente: CampoCliente_2.Selected,
                                                                        Cotação: Value(CampoCotacao_2.Text),
                                                                        Receber: CampoReceber_2.Value,
                                                                        CR: CampoCR_2.Text,
                                                                        'Forma de Pagamento': CampoFormaPagamento_2.Selected.Value,
                                                                        Proprietário: User(),
                                                                        'Endereço de Saída 1': CampoEndSaidaRet_3.Text,
                                                                        Motorista: CampoMotorista_1.Selected,
                                                                        'Status de Operação': CampoStatus_1.Selected.Value
                                                                    }
                                                                )
                                                            },
                                                            {
                                                                DataAgendada: DataAtual,
                                                                Resultado: ResultadoPatch
                                                            }
                                                        )
                                                    )
                                                );
                                                // N:N Frequente Retorno
                                                ForAll(
                                                    colResultadosRetorno,
                                                    With(
                                                        {ServicoAtual: ThisRecord.Resultado},
                                                        If(
                                                            !IsError(ServicoAtual) && !IsBlank(ServicoAtual) && CountRows(colOrdemPassageiros) > 0,
                                                            ForAll(
                                                                colOrdemPassageiros,
                                                                Patch(
                                                                    'Serviços por Passageiro',
                                                                    Defaults('Serviços por Passageiro'),
                                                                    {
                                                                        'Geral (Coluna Serviços por Passageiro)': ServicoAtual,
                                                                        'Banco de Dados (Coluna Serviços por Passageiro)': ThisRecord.Passageiro,
                                                                        'Ordem de Seleção (Coluna Serviços por Passageiro)': ThisRecord.OrdemSelecao
                                                                    }
                                                                )
                                                            )
                                                        )
                                                    )
                                                );
                                                ForAll(
                                                    colResultadosRetorno,
                                                    Collect(
                                                        colPatchResults,
                                                        {
                                                            Data: ThisRecord.DataAgendada,
                                                            Tipo: "Retorno",
                                                            Resultado: ThisRecord.Resultado
                                                        }
                                                    );
                                                    If(
                                                        IsError(ThisRecord.Resultado),
                                                        Notify(
                                                            "ERRO FREQUENTE (RETORNO): " & Text(
                                                                ThisRecord.DataAgendada,
                                                                "dd/mm/yyyy hh:mm"
                                                            ) & ". Detalhes: " & Concat(
                                                                Errors(
                                                                    'Reserva de veículos',
                                                                    ThisRecord.Resultado
                                                                ),
                                                                "Campo: " & ThisRecord.Column & " - Erro: " & ThisRecord.Message,
                                                                Char(10)
                                                            ),
                                                            NotificationType.Error,
                                                            7000
                                                        );
                                                        Collect(
                                                            colErrosTemporarios,
                                                            {
                                                                Erro: "Erro ao agendar serviço de retorno para " & Text(
                                                                    ThisRecord.DataAgendada,
                                                                    "dd/mm/yyyy hh:mm"
                                                                ) & ": Erro no patch"
                                                            }
                                                        )
                                                    )
                                                )
                                            )
                                        )
                                    );
                                    Set(
                                        varTotalAgendamentos,
                                        varTotalAgendamentos + 1
                                    );
                                    Set(
                                        varPatchSucesso,
                                        true
                                    )
                                );
                                // ERRO NO PATCH PRINCIPAL
                                If(
                                    IsError(resultadoPatchPrincipal) || IsBlank(resultadoPatchPrincipal),
                                    Set(
                                        varErroDetalhadoPrincipal,
                                        Concat(
                                            Errors(
                                                'Reserva de veículos',
                                                resultadoPatchPrincipal
                                            ),
                                            "Campo: " & ThisRecord.Column & " - Erro: " & ThisRecord.Message,
                                            Char(10)
                                        )
                                    );
                                    Notify(
                                        "Falha no PATCH PRINCIPAL (Novo Registro). Detalhes: " & varErroDetalhadoPrincipal,
                                        NotificationType.Error,
                                        7000
                                    );
                                    UpdateContext({varpopupLoading: false});
                                    Set(
                                        varErroGlobalOcorreu,
                                        true
                                    )
                                )
                            );
                            // ============================================================================
                            // EDIÇÃO DE REGISTRO
                            // ============================================================================
                            If(
                                gblIsNewRecord = false,
                                If(
                                    CampoAgendarRet_2.Value = true || CampoRepetir_1.Value = true,
                                    UpdateContext({varpopupLoading: false});
                                    Notify(
                                        "Agendamento de retorno e serviços frequentes só na criação.",
                                        NotificationType.Error,
                                        7000
                                    );
                                    Set(
                                        varErroGlobalOcorreu,
                                        true
                                    )
                                );
                                If(
                                    !varErroGlobalOcorreu,
                                    Set(
                                        resultadoPatchEdicao,
                                        Patch(
                                            'Reserva de veículos',
                                            LookUp(
                                                'Reserva de veículos',
                                                'GUID Reserva de Veículos' = GUID(gblRecordId)
                                            ),
                                            {
                                                'Ed de Saída - VIEW': varEnderecoCompleto,
                                                'Endereço de Saída Personalizado': If(
                                                    varEdSaidaPersonalizado,
                                                    CampoEdSaidaPersonalizado.Text,
                                                    Blank()
                                                ),
                                                Destino: CampoDestino.Text,
                                                'Status de Faturamento': CampoStatusdeFaturamento.Selected.Value,
                                                OP: CampoOP.Selected,
                                                'Data e horário de saída': varDataHoraPrincipal,
                                                'Previsão de retorno': varDataHoraRetornoPrevista,
                                                'Tipo do Serviço': CampoTipodeServiço_1.Selected.Value,
                                                'Obs de Operação': ObsMotorista,
                                                'Observação interna': ObsInterna,
                                                'Observação Final': ObsFinal,
                                                'Perfil do passageiro': varPreferenciasConcatenadas,
                                                'Tipo de Veículo': CampoTipoDoVeículo_1.Selected.Value,
                                                Email: varEmaildoPassageiro,
                                                Trajeto: varTrajeto,
                                                'Pax - VIEW': varPassageirosTelefones,
                                                Solicitante: CampoSolicitante_2.Selected,
                                                Cliente: CampoCliente_2.Selected,
                                                Cotação: Value(CampoCotacao_2.Text),
                                                Receber: CampoReceber_2.Value,
                                                CR: CampoCR_2.Text,
                                                'Forma de Pagamento': CampoFormaPagamento_2.Selected.Value,
                                                'Status de Operação': CampoStatus_1.Selected.Value,
                                                Motorista: CampoMotorista_1.Selected
                                            }
                                        )
                                    );
                                    If(
                                        !IsError(resultadoPatchEdicao) && !IsBlank(resultadoPatchEdicao),
                                        RemoveIf(
                                            'Serviços por Passageiro',
                                            'Geral (Coluna Serviços por Passageiro)'.'GUID Reserva de Veículos' = GUID(gblRecordId)
                                        );
                                        //N:N Edição
                                        With(
                                            {_pai: resultadoPatchEdicao},
                                            ForAll(
                                                colOrdemPassageiros As _item,
                                                Patch(
                                                    'Serviços por Passageiro',
                                                    Defaults('Serviços por Passageiro'),
                                                    {
                                                        'Geral (Coluna Serviços por Passageiro)': _pai,
                                                        'Banco de Dados (Coluna Serviços por Passageiro)': _item.Passageiro,
                                                        'Ordem de Seleção (Coluna Serviços por Passageiro)': _item.OrdemSelecao,
                                                        'Endereço de Saída (Coluna Serviços por Passageiro)': If(
                                                            varEdSaidaPersonalizado,
                                                            "",
                                                            Coalesce(
                                                                LookUp(
                                                                    colEnderecoRascunho,
                                                                    OrdemSelecao = _item.OrdemSelecao,
                                                                    EnderecoDigitado
                                                                ),
                                                                _item.EnderecoSaidaBD,
                                                                ""
                                                            )
                                                        )
                                                    }
                                                )
                                            )
                                        );
                                        Set(
                                            varPatchSucesso,
                                            true
                                        );
                                        Notify(
                                            "✅ Edição salva com sucesso!",
                                            NotificationType.Success,
                                            3000
                                        ),
                                        // ✅ FIX 2: Tratamento de erro na edição
                                        Set(
                                            varErroDetalhadoEdicao,
                                            Concat(
                                                Errors(
                                                    'Reserva de veículos',
                                                    resultadoPatchEdicao
                                                ),
                                                "Campo: " & ThisRecord.Column & " - Erro: " & ThisRecord.Message,
                                                Char(10)
                                            )
                                        );
                                        Notify(
                                            "Falha ao salvar edição. Detalhes: " & varErroDetalhadoEdicao,
                                            NotificationType.Error,
                                            7000
                                        );
                                        UpdateContext({varpopupLoading: false});
                                        Set(
                                            varErroGlobalOcorreu,
                                            true
                                        )
                                    )
                                )
                            );
                            // ============================================================================
                            // AGENDAMENTO DE RETORNO SEPARADO
                            // ============================================================================
                            If(
                                !varErroGlobalOcorreu && CampoAgendarRet_2.Value = true && varPatchSucesso = true && gblIsNewRecord = true,
                                Set(
                                    varTrajetoInvertido,
                                    If(
                                        !IsBlank(varTrajeto) && CountRows(
                                            Split(
                                                varTrajeto,
                                                " / "
                                            )
                                        ) >= 2,
                                        With(
                                            {
                                                partes: Split(
                                                    varTrajeto,
                                                    " / "
                                                ),
                                                n: CountRows(
                                                    Split(
                                                        varTrajeto,
                                                        " / "
                                                    )
                                                )
                                            },
                                            Concat(
                                                Sequence(n),
                                                Last(
                                                    FirstN(
                                                        partes,
                                                        n - Value + 1
                                                    )
                                                ).Value,
                                                " / "
                                            )
                                        ),
                                        varTrajeto
                                    )
                                );
                                Set(
                                    resultadoRetornoPatch,
                                    Patch(
                                        'Reserva de veículos',
                                        Defaults('Reserva de veículos'),
                                        {
                                            'Ed de Saída - VIEW': CampoEndSaidaRet_3.Text,
                                            Destino: CampoDestinoRet_4.Text,
                                            'Status de Faturamento': CampoStatusdeFaturamento.Selected.Value,
                                            'Status de Operação': CampoStatus_1.Selected.Value,
                                            Trajeto: varTrajetoInvertido,
                                            OP: CampoOP.Selected,
                                            'Data e horário de saída': varDataHoraRetorno,
                                            'Pax - VIEW': varPassageirosTelefones,
                                            'Obs de Operação': ObsMotoristaRet,
                                            'Observação interna': ObsInternaRet,
                                            'Observação Final': ObsFinalRet,
                                            'Perfil do passageiro': varPreferenciasConcatenadas,
                                            'Tipo de Veículo': CampoTipoDoVeículo_1.Selected.Value,
                                            'Tipo do Serviço': CampoTipodeServiço_1.Selected.Value,
                                            Email: varEmaildoPassageiro,
                                            Solicitante: If(
                                                !IsBlank(CampoSolicitante_2.Selected.'GUID Banco de Dados'),
                                                LookUp(
                                                    'Banco de Dados',
                                                    'GUID Banco de Dados' = CampoSolicitante_2.Selected.'GUID Banco de Dados'
                                                ),
                                                Blank()
                                            ),
                                            Cliente: CampoCliente_2.Selected,
                                            Cotação: Value(CampoCotacao_2.Text),
                                            Receber: CampoReceber_2.Value,
                                            CR: CampoCR_2.Text,
                                            'Forma de Pagamento': CampoFormaPagamento_2.Selected.Value,
                                            'Endereço de Saída 1': CampoEndSaidaRet_3.Text,
                                            Proprietário: User(),
                                            Motorista: If(
                                                !IsBlank(CampoMotorista_1.Selected.'GUID Funcionários'),
                                                LookUp(
                                                    Funcionários,
                                                    'GUID Funcionários' = CampoMotorista_1.Selected.'GUID Funcionários'
                                                ),
                                                Blank()
                                            )
                                        }
                                    )
                                );
                                If(
                                    !IsError(resultadoRetornoPatch) && !IsBlank(resultadoRetornoPatch) && CountRows(colOrdemPassageiros) > 0,
                                    ForAll(
                                        colOrdemPassageiros,
                                        Patch(
                                            'Serviços por Passageiro',
                                            Defaults('Serviços por Passageiro'),
                                            {
                                                'Geral (Coluna Serviços por Passageiro)': resultadoRetornoPatch,
                                                'Banco de Dados (Coluna Serviços por Passageiro)': ThisRecord.Passageiro,
                                                'Ordem de Seleção (Coluna Serviços por Passageiro)': ThisRecord.OrdemSelecao
                                            }
                                        )
                                    )
                                );
                                If(
                                    !IsError(resultadoRetornoPatch) && !IsBlank(resultadoRetornoPatch),
                                    Collect(
                                        colPatchResults,
                                        {
                                            Data: varDataHoraRetorno,
                                            Tipo: "Retorno",
                                            Resultado: resultadoRetornoPatch
                                        }
                                    );
                                    Set(
                                        varTotalAgendamentos,
                                        varTotalAgendamentos + 1
                                    )
                                );
                                If(
                                    IsError(resultadoRetornoPatch) || IsBlank(resultadoRetornoPatch),
                                    Set(
                                        varErroDetalhadoRetorno,
                                        Concat(
                                            Errors(
                                                'Reserva de veículos',
                                                resultadoRetornoPatch
                                            ),
                                            "Campo: " & ThisRecord.Column & " - Erro: " & ThisRecord.Message,
                                            Char(10)
                                        )
                                    );
                                    Notify(
                                        "Falha no AGENDAMENTO DE RETORNO. Detalhes: " & varErroDetalhadoRetorno,
                                        NotificationType.Error,
                                        7000
                                    );
                                    UpdateContext({varpopupLoading: false});
                                    Set(
                                        varErroGlobalOcorreu,
                                        true
                                    )
                                )
                            )
                        );
                        // ================================================================================
                        // NOTIFICAÇÃO FINAL
                        // ================================================================================
                        If(
                            !varErroGlobalOcorreu,
                            If(
                                CountRows(colErrosTemporarios) > 0,
                                ForAll(
                                    colErrosTemporarios,
                                    Notify(
                                        ThisRecord.Erro,
                                        NotificationType.Error,
                                        7000
                                    )
                                );
                                UpdateContext({varpopupLoading: false});
                                Set(
                                    varErroGlobalOcorreu,
                                    true
                                ),
                                // else: tudo OK
                                Set(
                                    varTotalAgendamentos,
                                    CountRows(
                                        Filter(
                                            colPatchResults,
                                            !IsError(Resultado)
                                        )
                                    )
                                )
                            )
                        );
                        If(
                            !varErroGlobalOcorreu,
                            If(
                                varTotalAgendamentos > 0,
                                If(
                                    gblIsNewRecord = true,
                                    Set(
                                        varSuccessMessage,
                                        varTotalAgendamentos & " serviço(s) solicitado(s) com sucesso!"
                                    ),
                                    Set(
                                        varSuccessMessage,
                                        "Serviço editado com sucesso! Data: " & Text(
                                            varDataHoraPrincipal,
                                            "dd/mm/yyyy hh:mm"
                                        ) & "   Trajeto: " & varTrajeto & "   Tipo do Veículo: " & CampoTipoDoVeículo_1.Selected.Value
                                    )
                                )
                            )
                        );
                        ClearCollect(
                            colServicosSolicitados,
                            Filter(
                                colPatchResults,
                                !IsError(Resultado)
                            ).Resultado
                        );
                        // ================================================================================
                        // RESET FINAL
                        // ================================================================================
                        If(
                            !varErroGlobalOcorreu,
                            Set(
                                varResettxt,
                                ""
                            );
                            Set(
                                varEdSaidaPersonalizado,
                                false
                            );
                            UpdateContext({varPopupVisible: true});
                            Reset(CampoDataSaida_2);
                            Reset(CampoHoraSaida_2);
                            Reset(CampoMinutoSaida_2);
                            Reset(CampoHorarioRetPrev_2);
                            Reset(CampoMinutoRetPrev_2);
                            Reset(CampoCliente_2);
                            Reset(CampoSolicitante_2);
                            Reset(CampoTipodeServiço_1);
                            Reset(CampoTipoDoVeículo_1);
                            Reset(CampoMotorista_1);
                            Reset(CampoTrajeto_2);
                            Reset(CampoObsOp_1);
                            Reset(CampoReceber_2);
                            Reset(CampoCotacao_2);
                            Reset(CampoFormaPagamento_2);
                            Reset(CampoCR_2);
                            Reset(CampoDestino);
                            Reset(CampoAgendarRet_2);
                            Reset(CampoDataRet_3);
                            Reset(CampoHoraRet_3);
                            Reset(CampoMinutoRet_3);
                            Reset(CampoEndSaidaRet_3);
                            Reset(CampoDestinoRet_4);
                            Reset(CampoObsdeOperaçãoRet_5);
                            Reset(CampoRepetir_1);
                            Reset(CampoDataInicio_2);
                            Reset(CampoDataFim_1);
                            Reset(CampoRadioFrequente_1);
                            Reset(CampoFDS_1);
                            Reset(CampoStatus_1);
                            Set(varClienteSelecionado, Blank());
                            Set(
                                ObsInterna,
                                ""
                            );
                            Set(
                                ObsInternaRet,
                                ""
                            );
                            Set(
                                ObsMotorista,
                                ""
                            );
                            Set(
                                ObsMotoristaRet,
                                ""
                            );
                            Set(
                                ObsPassageiro,
                                ""
                            );
                            Set(
                                ObsPassageiroRet,
                                ""
                            );
                            Set(
                                ObsFinal,
                                ""
                            );
                            Set(
                                ObsFinalRet,
                                ""
                            );
                            Clear(colOrdemPassageiros);
                            UpdateContext({varpopupLoading: false})
                        );
                      Text: |-
                        =If(
