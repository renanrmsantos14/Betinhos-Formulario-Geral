Screens:
  Screen_Formulario_1:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |-
        =UpdateContext({varpopupLoading: true});
        // 1. Inicialização de UI
        Set(
            varCurrentTab,
            "Detalhes"
        );
        Set(
            TipoObsAtual,
            "Motorista"
        );
        UpdateContext({varPopupVisible: false});

        // 2. Verifica endereço personalizado
        With(
            {
                _temPersonalizado: !IsBlank(
                    LookUp(
                        'Reserva de veículos',
                        'GUID Reserva de Veículos' = GUID(gblRecordId),
                        'Endereço de Saída Personalizado'
                    )
                ),
                _registrosRelacionados: Filter(
                    'Serviços por Passageiro',
                    'Geral (Coluna Serviços por Passageiro)'.'GUID Reserva de Veículos' = GUID(gblRecordId)
                )
            },
            Set(
                varEdSaidaPersonalizado,
                If(
                    !IsBlank(gblRecordId) && gblIsNewRecord = false,
                    _temPersonalizado || (CountRows(_registrosRelacionados) > 0 && CountRows(
                        Filter(
                            _registrosRelacionados,
                            !IsBlank('Endereço de Saída (Coluna Serviços por Passageiro)') && 'Endereço de Saída (Coluna Serviços por Passageiro)' <> ""
                        )
                    ) = 0),
                    false
                )
            )
        );

        // 3. Popula colPassageirosServico
        If(
            !IsBlank(gblRecordId) && gblIsNewRecord = false && !varEdSaidaPersonalizado,
            ClearCollect(
                colPassageirosServico,
                ForAll(
                    SortByColumns(
                        Filter(
                            'Serviços por Passageiro',
                            'Geral (Coluna Serviços por Passageiro)'.'GUID Reserva de Veículos' = GUID(gblRecordId)
                        ),
                        "cr40f_ordemdeselecao",
                        SortOrder.Ascending
                    ) As _rel,
                    {
                        OrdemSelecao: _rel.'Ordem de Seleção (Coluna Serviços por Passageiro)',
                        Passageiro: _rel.'Banco de Dados (Coluna Serviços por Passageiro)',
                        GUIDPassageiro: Text(_rel.'Banco de Dados (Coluna Serviços por Passageiro)'.'GUID Banco de Dados'),
                        RegistroBD: _rel.'Banco de Dados (Coluna Serviços por Passageiro)',
                        Telefone: _rel.'Banco de Dados (Coluna Serviços por Passageiro)'.Telefone,
                        EnderecoEditado: Coalesce(
                            _rel.'Endereço de Saída (Coluna Serviços por Passageiro)',
                            _rel.'Banco de Dados (Coluna Serviços por Passageiro)'.'Endereço de Saída'
                        )
                    }
                )
            ),
            !IsBlank(gblRecordId) && gblIsNewRecord = false && varEdSaidaPersonalizado,
            ClearCollect(
                colPassageirosServico,
                ForAll(
                    SortByColumns(
                        Filter(
                            'Serviços por Passageiro',
                            'Geral (Coluna Serviços por Passageiro)'.'GUID Reserva de Veículos' = GUID(gblRecordId)
                        ),
                        "cr40f_ordemdeselecao",
                        SortOrder.Ascending
                    ) As _rel,
                    {
                        OrdemSelecao: _rel.'Ordem de Seleção (Coluna Serviços por Passageiro)',
                        Passageiro: _rel.'Banco de Dados (Coluna Serviços por Passageiro)',
                        GUIDPassageiro: Text(_rel.'Banco de Dados (Coluna Serviços por Passageiro)'.'GUID Banco de Dados'),
                        RegistroBD: _rel.'Banco de Dados (Coluna Serviços por Passageiro)',
                        Telefone: _rel.'Banco de Dados (Coluna Serviços por Passageiro)'.Telefone,
                        EnderecoEditado: ""
                    }
                )
            ),
            ClearCollect(
                colPassageirosServico,
                {
                    OrdemSelecao: 1,
                    Passageiro: Blank(),
                    GUIDPassageiro: "",
                    RegistroBD: Blank(),
                    Telefone: "",
                    EnderecoEditado: ""
                }
            )
        );

        // 4. Sincroniza rascunho
        ClearCollect(
            colEnderecoRascunho,
            ForAll(
                colPassageirosServico As _item,
                {
                    OrdemSelecao: _item.OrdemSelecao,
                    EnderecoDigitado: Coalesce(
                        _item.EnderecoEditado,
                        ""
                    )
                }
            )
        );

        UpdateContext({varpopupLoading: false})
